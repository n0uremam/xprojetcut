[build]
  functions = "../netlify/functions"
  publish = "."

[functions]
  included_files = ["../templates/**", "../static/**", "../patterns.db"]

[[redirects]]
  from = "/"
  to = "/home"
  status = 302

[[redirects]]
  from = "/home"
  to = "/Homepage.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
