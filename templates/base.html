<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patterns Library</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">Patterns Library</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            {% if user %}
            <li class="nav-item me-3 d-flex align-items-center text-muted">
              Signed in as <span class="fw-semibold ms-1">{{ user['username'] }}</span>
            </li>
            {% if user['is_admin'] %}
            <li class="nav-item"><a class="btn btn-outline-primary me-2" href="{{ url_for('create_pattern') }}">Admin: Upload</a></li>
            {% endif %}
            <li class="nav-item"><a class="btn btn-secondary" href="{{ url_for('logout') }}">Logout</a></li>
            {% else %}
            <li class="nav-item"><a class="btn btn-primary" href="{{ url_for('login') }}">Login</a></li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>
    <main class="container mb-5">
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='filters.js') }}"></script>
  </body>
</html>
