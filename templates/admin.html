{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h3 class="mb-3">Upload New Pattern</h3>
        <p class="text-muted">Admins can publish new exterior, interior, and specialty patterns to the library.</p>
        <form method="post">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Pattern Code</label>
              <input type="text" name="code" class="form-control" placeholder="PAT010" required>
            </div>
            <div class="col-md-8">
              <label class="form-label">Name</label>
              <input type="text" name="name" class="form-control" placeholder="Premium Window Tint" required>
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="2" name="description" placeholder="Brief summary of the pattern" required></textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label">Vehicle Type</label>
              <input type="text" name="type" class="form-control" placeholder="Exterior" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Brand</label>
              <input type="text" name="brand" class="form-control" placeholder="Audi" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Year</label>
              <input type="text" name="year" class="form-control" placeholder="2024" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Model</label>
              <input type="text" name="model" class="form-control" placeholder="A6" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Trim</label>
              <input type="text" name="trim" class="form-control" placeholder="S-Line" required>
            </div>
            <div class="col-12">
              <label class="form-label">Tags (comma separated)</label>
              <input type="text" name="tags" class="form-control" placeholder="luxury,blackout,sedan">
            </div>
            <div class="col-12">
              <label class="form-label">Image URL</label>
              <input type="url" name="image_url" class="form-control" placeholder="https://images.unsplash.com/...">
            </div>
            <div class="col-12 d-flex justify-content-end gap-2">
              <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Cancel</a>
              <button class="btn btn-primary" type="submit">Publish Pattern</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
